<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galeri - PawCare</title>
    <link rel="icon" href="img/favicon-1.ico" type="image/x-icon" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <nav>
        <a href="index.html" class="logo">Paw<span>Care</span></a>
        <ul>
          <li><a href="index.html">Beranda</a></li>
          <li><a href="tentang.html">Tentang</a></li>
          <li><a href="layanan.html">Layanan</a></li>
          <li><a href="galeri.html" class="active">Galeri</a></li>
          <li><a href="kontak.html">Kontak</a></li>
        </ul>
      </nav>
    </header>

    <main class="container">
      <h1>Galeri Kegiatan & Perawatan PawCare</h1>

      <div
        class="grid-cards"
        style="grid-template-columns: repeat(auto-fit, minmax(350px, 1fr))"
      >
        <!-- Gambar 1 dibungkus a href agar bisa diklik -->
        <figure>
          <a
            href="img/kucing.jpg"
            target="_blank"
            title="Klik untuk memperbesar"
          >
            <img
              src="img/kucing.jpg"
              alt="Kucing sedang mandi"
              width="600"
              height="400"
            />
          </a>
          <figcaption>Kucing yang nyaman saat Premium Grooming.</figcaption>
        </figure>

        <figure>
          <img
            src="img/anjing.jpg"
            alt="Anjing sedang diperiksa"
            width="600"
            height="400"
          />
          <figcaption>
            Pemeriksaan rutin kesehatan anjing di Pet Clinic.
          </figcaption>
        </figure>

        <figure>
          <img
            src="img/kelinci.jpg"
            alt="Perawatan kelinci"
            width="600"
            height="400"
          />
          <figcaption>
            Perawatan kuku dan bulu mamalia kecil (Kelinci).
          </figcaption>
        </figure>

        <figure>
          <img
            src="img/reptil.jpg"
            alt="Pemeriksaan reptil"
            width="600"
            height="400"
          />
          <figcaption>
            Pemeriksaan dan konsultasi perawatan reptil eksotis.
          </figcaption>
        </figure>

        <figure>
          <img
            src="img/burung.png"
            alt="Burung hias"
            width="600"
            height="400"
          />
          <figcaption>
            Pakan dan multivitamin khusus untuk burung hias.
          </figcaption>
        </figure>

        <figure>
          <img
            src="img/shop.png"
            alt="Tampilan depan toko dan klinik"
            width="600"
            height="400"
          />
          <figcaption>Suasana interior Pet Shop dan Klinik PawCare.</figcaption>
        </figure>
      </div>
    </main>

    <footer>
      <p>&copy; 2026 PT PAWCARE JAYA ABADI. All Rights Reserved.</p>
    </footer>
  </body>
</html>
